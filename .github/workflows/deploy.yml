name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Analytics are kept out of the source tree. If the repository variable
      # ANALYTICS_SNIPPET is set (Settings > Secrets and variables > Actions >
      # Variables), its contents are inserted before </head> in the built page.
      - name: Inject analytics snippet
        if: ${{ vars.ANALYTICS_SNIPPET != '' }}
        env:
          SNIPPET: ${{ vars.ANALYTICS_SNIPPET }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "dist/index.html";
            const html = fs.readFileSync(file, "utf8");
            if (!html.includes("</head>")) { console.error("</head> not found"); process.exit(1); }
            fs.writeFileSync(file, html.replace("</head>", () => process.env.SNIPPET + "\n</head>"));
          '

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
